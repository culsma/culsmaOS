[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "culsma-os"
version = "0.2.3"
description = "Evidence-aware laboratory execution host with a resident program queue"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11,<3.13"
dependencies = ["culsma>=1.0.11,<1.1"]
[project.optional-dependencies]
# Install the MCP bridge in its own environment; vendor simulators pin conflicting dependencies.
mcp = ["mcp==2.3.0"]
simulator = ["culsma-opentrons-simulator @ https://github.com/culsma/culsma-driver-opentrons/releases/download/v0.1.0/culsma_opentrons_simulator-0.1.0-py3-none-any.whl#sha256=0a68156db50fbae39378123beaf97f0d1faada69333989cd53deeba268917cdd"]
hamilton = ["culsma-driver-hamilton @ https://github.com/culsma/culsma-driver-hamilton/releases/download/v0.1.2/culsma_driver_hamilton-0.1.2-py3-none-any.whl#sha256=46421f3cb44741f263e2122305a36044792ea42e4de482acd1e0a6572513f36b"]
dev = ["pytest>=8,<9", "coverage==7.10.7", "pytest-cov==7.0.0"]
[project.scripts]
culsma-os = "culsma_os.cli:CulsmaOSCLI.main"
[project.entry-points."culsma.program_executors"]
os-opentrons-simulator = "culsma_os.bootstrap:OpentronsProgramExecutorFactory"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "xunit1"

[tool.coverage.run]
source = ["culsma_os"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true

[tool.coverage.json]
output = "run-artifacts/coverage/coverage.json"
show_contexts = false

[tool.coverage.html]
directory = "run-artifacts/coverage/html"
show_contexts = true

[tool.setuptools.package-data]
"culsma_os.console" = ["web/*.html", "web/*.js", "web/*.css", "web/assets/*.png"]

"culsma_os.program_manager" = ["fault_guidance.json"]
