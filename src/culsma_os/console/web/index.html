<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CulsmaOS · Station console</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/culsma-logo.png">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#station"><img src="/assets/culsma-os-wordmark.png" alt="CulsmaOS"></a>
    <div class="top-label">Station console <span class="badge neutral">Draft editing</span></div>
  </header>
  <main>
    <div class="page-heading"><div><p class="eyebrow">LOCAL LABORATORY WORKSPACE</p><h1 id="title">Station overview</h1></div><button id="refresh" type="button">Refresh</button></div>
    <nav aria-label="Console pages"><a href="#station" id="station-tab" aria-current="page">Station</a><a href="#runs" id="runs-tab">Runs</a><a href="#configuration" id="configuration-tab">Configuration</a></nav>
    <div class="status-strip" role="status" aria-live="polite"><span id="connection" class="badge neutral">Connecting</span><span id="observed">Waiting for the resident service</span></div>
    <section id="alert" class="alert" role="alert" hidden></section>
    <section id="content" aria-label="Station information"><p class="empty">Reading OS records…</p></section>
    <footer>OS records and simulator execution evidence. No live hardware or scientific measurement is implied. Snapshots are separate reads.</footer>
  </main>
</body>
</html>
