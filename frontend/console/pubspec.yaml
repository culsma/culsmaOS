name: culsma_console
description: The local culsmaOS desktop console.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  crypto: ^3.0.7
  desktop_drop: 0.9.2
  syntax_highlight: 0.4.0
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/culsma-os-wordmark.png
    - assets/syntax/culsma.tmLanguage.json
    - assets/fonts/RobotoMono-OFL.txt
  fonts:
    - family: Console
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500

    - family: Code
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
